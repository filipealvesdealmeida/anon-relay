# Roteamento do cofre no Apache — OPCIONAL.
#
# O cofre escuta em 127.0.0.1:3020 e quem fala com ele e o worker do sistema
# operador, pelo loopback. Nao e preciso expor nada a internet para o servico
# funcionar.
#
# Este trecho existe so para deixar as rotas de AUDITORIA acessiveis de fora —
# /version e /privacy/manifest — de modo que um cliente ou auditor consiga
# conferir a procedencia sem acesso ao servidor.
#
# Instalar dentro do <VirtualHost *:443> do dominio, ANTES das regras que
# mandam o restante pro Node do sistema.

  # So leitura, so as rotas de prova. O envio NAO passa por aqui.
  ProxyPass        /anon-api/version           http://127.0.0.1:3020/version
  ProxyPassReverse /anon-api/version           http://127.0.0.1:3020/version
  ProxyPass        /anon-api/privacy/manifest  http://127.0.0.1:3020/privacy/manifest
  ProxyPassReverse /anon-api/privacy/manifest  http://127.0.0.1:3020/privacy/manifest
  ProxyPass        /anon-api/health            http://127.0.0.1:3020/health
  ProxyPassReverse /anon-api/health            http://127.0.0.1:3020/health

# ── Depois de instalar ──────────────────────────────────────────────────────
#   a2enmod proxy proxy_http
#   apachectl configtest && systemctl reload apache2
#
# Conferir:
#   curl -s https://SEU-DOMINIO/anon-api/version | jq
#   curl -s https://SEU-DOMINIO/anon-api/privacy/manifest | jq
