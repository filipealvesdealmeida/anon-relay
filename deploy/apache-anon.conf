# Roteamento do modo anonimo no Apache da VPS.
#
# O ponto crucial: /anon-api/ vai DIRETO pro container (porta 3020) e nunca
# entra no processo do sistema principal. A planilha sai do navegador e chega
# no relay sem passar por nenhum codigo que tenha banco de dados. Se passasse,
# a garantia inteira dependeria de confiar naquele codigo.
#
# Instalar dentro do <VirtualHost *:443> do dominio principal, ANTES das regras
# que mandam o restante pro Node do sistema (porta 3010).

  # ── Painel anonimo -> relay (bypass total do sistema principal) ───────────
  ProxyPass        /anon-api/  http://127.0.0.1:3020/
  ProxyPassReverse /anon-api/  http://127.0.0.1:3020/

  # ── Webhook da Meta para os numeros anonimos ──────────────────────────────
  # Configure esta URL no App Meta dos numeros dedicados ao modo anonimo:
  #   https://SEU-DOMINIO/anon-webhook
  ProxyPass        /anon-webhook  http://127.0.0.1:3020/webhook
  ProxyPassReverse /anon-webhook  http://127.0.0.1:3020/webhook

  # Corpo grande: a planilha chega como JSON (12MB por padrao).
  LimitRequestBody 16777216

  # Nao registrar query string desta rota no access log (nao ha dado pessoal em
  # URL aqui, e a regra existe pra manter assim).
  SetEnvIf Request_URI "^/anon-api/" dontlog
  CustomLog ${APACHE_LOG_DIR}/access.log combined env=!dontlog

# ── Depois de instalar ──────────────────────────────────────────────────────
#   a2enmod proxy proxy_http
#   apachectl configtest && systemctl reload apache2
#
# Conferir:
#   curl -s https://SEU-DOMINIO/anon-api/version | jq
#   curl -s https://SEU-DOMINIO/anon-api/privacy/scan | jq '.ok, .achados'
